name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/ghostlist-server
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/ghostlist-client
  ADMIN_CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/ghostlist-admin-client

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/sync-version.js --check

  test-server:
    name: .NET Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore server/GhostList.slnx

      - name: Build
        run: dotnet build server/GhostList.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test server/GhostList.slnx --no-build --configuration Release

  build-client:
    name: Angular Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: client
        run: npm run build

  build-admin-client:
    name: Admin Angular Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: admin-client/package-lock.json

      - name: Install
        working-directory: admin-client
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: admin-client
        run: npm run build

  release:
    name: Bump Version & Publish Images
    runs-on: ubuntu-latest
    needs: [test-server, build-client, build-admin-client]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine new version
        id: ver
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          IFS='.' read -r MAJ MIN PAT < VERSION
          FIRST=$(echo "$COMMIT_MSG" | head -1)
          if echo "$FIRST" | grep -iq "^Major:"; then
            NEW="$((MAJ+1)).0.0"
          elif echo "$FIRST" | grep -iq "^Minor:"; then
            NEW="$MAJ.$((MIN+1)).0"
          else
            NEW="$MAJ.$MIN.$((PAT+1))"
          fi
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $(cat VERSION) → $NEW"

      - name: Apply version bump
        run: node scripts/sync-version.js ${{ steps.ver.outputs.new }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push server
        run: |
          docker build -f server/Dockerfile -t ${{ env.SERVER_IMAGE }}:latest .
          docker push ${{ env.SERVER_IMAGE }}:latest

      - name: Build & push client
        run: |
          docker build -f client/Dockerfile -t ${{ env.CLIENT_IMAGE }}:latest .
          docker push ${{ env.CLIENT_IMAGE }}:latest

      - name: Build & push admin client
        run: |
          docker build -f admin-client/Dockerfile -t ${{ env.ADMIN_CLIENT_IMAGE }}:latest .
          docker push ${{ env.ADMIN_CLIENT_IMAGE }}:latest

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION \
                client/package.json \
                client/src/app/version.ts \
                admin-client/package.json \
                admin-client/src/app/version.ts \
                "server/GhostList.WebApi/GhostList.WebApi.csproj"
          git commit -m "chore: bump version to ${{ steps.ver.outputs.new }}"
          git pull --rebase origin main
          git push

