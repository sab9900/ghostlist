upstream api {
    server server:8080;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API
    location /api/ {
        # Encrypted media (video especially) can exceed nginx's 1MB default body limit.
        client_max_body_size 40M;
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy SignalR (WebSocket upgrade)
    location /hubs/ {
        proxy_pass             http://api;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     86400s;
    }

    # Universal Links (iOS) / App Links (Android) verification files —
    # served by WellKnownController in the backend. Without this, the SPA
    # fallback below swallows the request and serves index.html instead of
    # the AASA/assetlinks JSON, so iOS/Android never verify the domain and
    # links never open the app.
    location /.well-known/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Angular SPA — all unmatched routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
