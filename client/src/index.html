<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ghost List</title>
    <base href="/">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ghost List">
    <meta name="theme-color" content="#0e0e10">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        function updateAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        updateAppHeight();
        window.addEventListener('resize', updateAppHeight);
        // iOS PWA: window.innerHeight is not final on first synchronous execution
        // in standalone mode — the WebView finishes layout asynchronously. A single
        // rAF is enough on most devices; the 300ms fallback covers edge cases where
        // the first rAF still fires before the safe-area geometry is committed.
        if (navigator.standalone) {
            requestAnimationFrame(updateAppHeight);
            setTimeout(updateAppHeight, 300);
        }
    </script>
</head>

<body>
    <app-root></app-root>
</body>

</html>
