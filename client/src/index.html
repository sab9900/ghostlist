<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ghost List</title>
    <base href="/">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ghost List">
    <meta name="theme-color" content="#0e0e10">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // iOS Home-Screen PWA ("WebClip"): the system reserves the home-indicator
        // strip at the bottom and paints it independently of the page, using the
        // <meta name="theme-color"> content as its fill. That meta tag was static
        // (#0e0e10) while the app itself switches between dark and light via
        // data-theme — so on light theme/light system mode the reserved strip
        // stayed dark, showing up as a visible mismatched "chin". Keep it synced
        // with the resolved theme before first paint; theme.service.ts keeps it
        // in sync afterwards for runtime theme changes.
        function syncThemeColorMeta() {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) { }
            var resolved = stored === 'light' || stored === 'dark'
                ? stored
                : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', resolved === 'light' ? '#f4f4f6' : '#0e0e10');
        }
        syncThemeColorMeta();

        function updateAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        updateAppHeight();
        window.addEventListener('resize', updateAppHeight);
        // iOS PWA: window.innerHeight is not final on first synchronous execution
        // in standalone mode — the WebView finishes layout asynchronously. A single
        // rAF is enough on most devices; the 300ms fallback covers edge cases where
        // the first rAF still fires before the safe-area geometry is committed.
        if (navigator.standalone) {
            requestAnimationFrame(updateAppHeight);
            setTimeout(updateAppHeight, 300);
            // iOS Home-Screen PWA only (WebClip): the WebClip already claims back
            // the bottom safe-area from the usable layout viewport itself (this is
            // why --app-height has to be sourced from window.innerHeight instead of
            // 100%/100dvh in the first place — see above). Padding components for
            // env(safe-area-inset-bottom) *on top of* that already-shrunk viewport
            // double-subtracts the home-indicator height. Capacitor's native
            // WKWebView and Android (PWA or not) don't pre-shrink the viewport, so
            // they still need the real safe-area padding — only this WebClip case
            // doesn't. See --safe-bottom override in styles.scss.
            document.documentElement.classList.add('ios-webclip');
        }
    </script>
</head>

<body>
    <app-root></app-root>
</body>

</html>
