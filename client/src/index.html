<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ghost List</title>
    <base href="/">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ghost List">
    <meta name="theme-color" content="#0e0e10">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // Android (native WebView and PWA/Chrome alike): interactive-widget=overlays-content
        // is what iOS handles well (manual padding via VisualViewport, see
        // KeyboardInsetService) but Chromium-on-Android implements it unreliably —
        // the visual viewport's resize/scroll deltas don't line up cleanly with the
        // keyboard inset, so the page either gains a phantom scrollable region the
        // height of the keyboard (native) or never gets padded at all, leaving the
        // keyboard covering the focused input (PWA). Android has long had solid
        // support for the older "real resize" model instead, so force that mode
        // there by rewriting the meta tag before first paint. iOS keeps
        // overlays-content untouched.
        if (/Android/i.test(navigator.userAgent)) {
            var viewportMeta = document.querySelector('meta[name="viewport"]');
            if (viewportMeta) {
                viewportMeta.setAttribute(
                    'content',
                    viewportMeta.getAttribute('content').replace('interactive-widget=overlays-content', 'interactive-widget=resizes-content')
                );
            }
        }

        // Keep <meta name="theme-color"> synced with the resolved theme before
        // first paint (theme.service.ts keeps it in sync afterwards for runtime
        // theme changes). Note: iOS 26 dropped support for this meta tag for
        // standalone home-screen apps — Safari now tints the top/bottom bars
        // from the actual background-color of the page (or, due to a WebKit
        // bug, of whatever fixed-position element it picks instead — see the
        // ios-webclip removal below). Keeping this in sync still helps on
        // older iOS/Android and costs nothing.
        function syncThemeColorMeta() {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) { }
            var resolved = stored === 'light' || stored === 'dark'
                ? stored
                : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', resolved === 'light' ? '#f4f4f6' : '#0e0e10');
        }
        syncThemeColorMeta();

        function updateAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        updateAppHeight();
        window.addEventListener('resize', updateAppHeight);

        // iOS Home-Screen PWA (WebClip) only: window.innerHeight is correct
        // (the full physical screen height) once the WebView's safe-area-aware
        // layout has committed, but on the very first synchronous read here —
        // before first paint — it can still report a shorter, pre-commit value.
        // A single rAF plus a fixed 300ms guess isn't reliable enough across
        // devices/iOS versions: when it's too short, --app-height gets stuck at
        // that smaller value (nothing ever re-triggers a recheck), app-root
        // compresses to fit it, and the real safe-area strip is left over below
        // as dead, unstyled space — the "squished app + foreign chin" the user
        // actually sees. Re-measure every frame instead of guessing a delay,
        // and stop once the value has held steady for a few frames in a row
        // (capped so a device that never truly settles can't loop forever).
        if (navigator.standalone) {
            (function settleAppHeight() {
                var lastHeight = -1;
                var stableFrames = 0;
                var startedAt = Date.now();
                function tick() {
                    updateAppHeight();
                    var stable = window.innerHeight === lastHeight;
                    lastHeight = window.innerHeight;
                    stableFrames = stable ? stableFrames + 1 : 0;
                    if (stableFrames >= 5 || Date.now() - startedAt > 2000) return;
                    requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
            })();
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', updateAppHeight);
            }
        }
    </script>
</head>

<body>
    <app-root></app-root>
</body>

</html>
