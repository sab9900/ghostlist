    <script>
        // Sets --app-height for the app shell.
        //
        // iOS PWA quirk: on older iOS, window.innerHeight returned the full
        // physical screen height (including safe-area-inset-bottom), which was
        // larger than the CSS viewport. On iOS 26+, this changed — innerHeight
        // now excludes the safe area, matching CSS viewport behaviour, which
        // leaves a ~32 px gap at the bottom.
        //
        // Fix: in iOS standalone PWA mode (navigator.standalone === true),
        // use Math.max(innerHeight, screen.height) so we always get the larger
        // of the two values. screen.height on iOS is always the full CSS-pixel
        // screen height regardless of safe-area treatment, so this future-
        // proofs us against further iOS viewport changes without affecting
        // Android, web PWA, or regular browser tabs.
        function updateAppHeight() {
            var isIosPwa = window.navigator.standalone === true;
            var h = isIosPwa
                ? Math.max(window.innerHeight, window.screen.height)
                : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', h + 'px');
        }
        updateAppHeight();
        window.addEventListener('resize', updateAppHeight);
    </script>
