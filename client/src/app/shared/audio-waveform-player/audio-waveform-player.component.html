<div class="waveform-player" [class.waveform-player--playing]="playing()">

    <audio #audioEl [src]="src()" preload="auto" (play)="onPlay()" (pause)="onPause()" (ended)="onEnded()"
        (loadedmetadata)="onLoadedMetadata()" (timeupdate)="onTimeUpdate()">
    </audio>

    <button type="button" class="waveform-player__play-btn" (click)="togglePlayback()"
        [attr.aria-label]="playing() ? 'Pause' : 'Play'">
        @if (playing()) {
        <svg lucidePause [size]="24" aria-hidden="true"></svg>
        } @else {
        <svg lucidePlay [size]="24" aria-hidden="true"></svg>
        }
    </button>

    <div class="waveform-player__body">
        <div class="waveform-player__bars" role="slider" [attr.aria-valuenow]="Math.round(progress() * 100)"
            aria-valuemin="0" aria-valuemax="100" aria-label="Audio progress" (click)="scrub($event)"
            (touchstart)="scrub($event)">
            @for (bar of bars(); track $index) {
            <span class="waveform-player__bar" [class.waveform-player__bar--played]="$index <= playheadBar()"
                [style.height.%]="bar.height * 100">
            </span>
            }
        </div>

        <div class="waveform-player__time">
            <span class="waveform-player__current">{{ formattedCurrent() }}</span>
            <span class="waveform-player__duration">{{ formattedDuration() }}</span>
        </div>
    </div>
</div>
