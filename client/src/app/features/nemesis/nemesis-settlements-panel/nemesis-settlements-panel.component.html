<div class="panel-root">

    <div class="list-toolbar">
        <button class="filter-btn" type="button" (click)="filterOpen.set(true)"
            [class.filter-btn--active]="filterActive()"
            [attr.aria-label]="'NEMESIS.FILTER_OPEN_ARIA' | translate">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
            </svg>
            @if (searchQuery()) {
                <span class="filter-btn__badge" aria-hidden="true"></span>
            }
        </button>
    </div>

    <div class="list">
        <app-settlement-matrix
            [debts]="filteredDebts()"
            [settlements]="filteredSettlements()"
            [currentUserId]="currentUserId"
            [members]="uniqueMembers"
            [highlightedToUserId]="highlightedDebtToUserId()"
            (settleRequested)="openSettleDialog($event)"
            (confirmSettlementRequested)="onConfirmSettlementRequested($event)"
            (declineSettlementRequested)="onDeclineSettlementRequested($event)"
            (forgiveSettlementRequested)="onForgiveSettlementRequested($event)"
        />
    </div>

    <app-nemesis-filter-dialog
        [show]="filterOpen()"
        [mode]="'settlements'"
        [query]="searchQuery()"
        [expenseSortOrder]="'createdAt'"
        [settlementSortOrder]="sortOrder()"
        (queryChange)="searchQuery.set($event)"
        (expenseSortOrderChange)="$event"
        (settlementSortOrderChange)="sortOrder.set($event)"
        (closed)="filterOpen.set(false)" />

</div>

@if (pendingSettlementDebt()) {
    <div class="overlay" #settleOverlay (click)="closeSettleDialog()">
        <div class="sheet sheet--form" (click)="$event.stopPropagation()">

            <div class="sheet__header">
                <span class="sheet__title">{{ 'NEMESIS.SETTLE_DIALOG_TITLE' | translate }}</span>
                <button class="sheet__close" (click)="closeSettleDialog()" [attr.aria-label]="'NEMESIS.DETAIL_CLOSE_ARIA' | translate">
                    <svg lucideX [size]="20" aria-hidden="true"></svg>
                </button>
            </div>

            <div class="sheet__body">
                <p class="settle-dialog__hint">
                    {{ 'NEMESIS.SETTLE_DIALOG_HINT' | translate: {
                        max: (pendingSettlementDebt()!.amount | number:'1.2-2'),
                        currency: pendingSettlementDebt()!.currency
                    } }}
                </p>
                <div class="form__row">
                    <input
                        class="form__amount"
                        type="number"
                        [ngModel]="pendingSettlementAmount()"
                        (ngModelChange)="pendingSettlementAmount.set(+$event)"
                        name="settleAmount"
                        [attr.placeholder]="'NEMESIS.AMOUNT_PLACEHOLDER' | translate"
                        min="0.01"
                        [max]="pendingSettlementDebt()!.amount"
                        step="0.01"
                    />
                    <span class="settle-dialog__currency">{{ pendingSettlementDebt()!.currency }}</span>
                </div>
            </div>

            <div class="sheet__footer">
                <button
                    class="sheet__submit"
                    [disabled]="(pendingSettlementAmount() ?? 0) <= 0"
                    (click)="confirmSettle()">
                    {{ 'NEMESIS.SETTLE_DIALOG_CONFIRM' | translate }}
                </button>
            </div>

        </div>
    </div>
}
