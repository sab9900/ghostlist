@if (show()) {
<app-overlay (dismissed)="closed.emit()">
    <div class="dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true"
        aria-labelledby="item-filter-dialog-title">
        <h2 class="title" id="item-filter-dialog-title">{{ 'ITEMS.FILTER_TITLE' | translate }}</h2>

        <div class="input-wrap">
            <input #input class="input" type="text"
                [attr.placeholder]="'ITEMS.FILTER_SEARCH_PLACEHOLDER' | translate"
                [ngModel]="query()" (ngModelChange)="onQueryChange($event)"
                [attr.aria-label]="'ITEMS.FILTER_SEARCH_PLACEHOLDER' | translate" />
            @if (query()) {
            <button type="button" class="input-clear" (click)="onQueryChange('')" aria-label="Clear search">
                <svg lucideX [size]="14" [strokeWidth]="2.5" aria-hidden="true"></svg>
            </button>
            }
        </div>

        <div class="sort">
            <span class="sort__label">{{ 'ITEMS.FILTER_SORT_LABEL' | translate }}</span>
            <div class="sort__options" role="radiogroup" [attr.aria-label]="'ITEMS.FILTER_SORT_LABEL' | translate">
                <button type="button" class="sort__option" [class.is-active]="sortOrder() === 'createdAt'"
                    role="radio" [attr.aria-checked]="sortOrder() === 'createdAt'"
                    (click)="onSortChange('createdAt')">{{ 'ITEMS.SORT_CREATED' | translate }}</button>
                <button type="button" class="sort__option" [class.is-active]="sortOrder() === 'az'"
                    role="radio" [attr.aria-checked]="sortOrder() === 'az'"
                    (click)="onSortChange('az')">{{ 'ITEMS.SORT_AZ' | translate }}</button>
                <button type="button" class="sort__option" [class.is-active]="sortOrder() === 'za'"
                    role="radio" [attr.aria-checked]="sortOrder() === 'za'"
                    (click)="onSortChange('za')">{{ 'ITEMS.SORT_ZA' | translate }}</button>
                <button type="button" class="sort__option" [class.is-active]="sortOrder() === 'priority'"
                    role="radio" [attr.aria-checked]="sortOrder() === 'priority'"
                    (click)="onSortChange('priority')">{{ 'ITEMS.SORT_PRIORITY' | translate }}</button>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn--primary" (click)="closed.emit()">{{ 'COMMON.CLOSE' | translate }}</button>
        </div>
    </div>
</app-overlay>
}
