@if (item(); as it) {
<app-overlay (dismissed)="close.emit()">
    <div class="dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true"
        [attr.aria-label]="'ITEMS.REMINDER_DIALOG_TITLE' | translate">
        <h3 class="title">{{ 'ITEMS.REMINDER_DIALOG_TITLE' | translate }}</h3>
        <p class="text">{{ it.text }}</p>

        <div class="fields">
            <label class="label">
                {{ 'ITEMS.REMINDER_DATETIME_LABEL' | translate }}
                <input class="input" type="datetime-local" [(ngModel)]="dateTime" [min]="minDateTime()" />
            </label>
        </div>

        @if (saved()) {
        <p class="saved">{{ 'ITEMS.REMINDER_SAVED' | translate }}</p>
        }

        <div class="actions">
            @if (saved()) {
            <button class="btn btn--ghost" type="button" (click)="close.emit()">{{ 'COMMON.CANCEL' | translate }}</button>
            <button class="btn btn--primary" type="button" (click)="downloadIcal.emit()">{{ 'ITEMS.REMINDER_ADD_TO_CALENDAR' | translate }}</button>
            } @else {
            <button class="btn btn--ghost" type="button" (click)="close.emit()">{{ 'COMMON.CANCEL' | translate }}</button>
            <button class="btn btn--primary" type="button" (click)="submit()" [disabled]="saving()">{{ 'ITEMS.REMINDER_SAVE' | translate }}</button>
            }
        </div>
    </div>
</app-overlay>
}
