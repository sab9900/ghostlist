<div class="screen" role="main">

    <app-ghost-mist [mode]="prefs.ghostMistMode()" />

    <app-lists-header
        [totalUnread]="totalUnread()"
        [showCoffeeLink]="showCoffeeLink"
        (logoClick)="onLogoClick()"
        (titleClick)="showFilterDialog.set(true)"
        (markAllReadOpen)="showMarkAllReadDialog.set(true)"
        (importOpen)="showImportDialog.set(true)"
        (exportOpen)="showExportDialog.set(true)"
        (settingsOpen)="goToSettings()"
        (aboutOpen)="goToAbout()" />

    <main class="content">

        @if (lists().length === 0) {
        <div class="empty" role="status" aria-live="polite">
            @if (searchQuery().trim() && visibleLists().length > 0) {
            <p class="empty__headline">{{ 'LISTS.SEARCH_NO_RESULTS' | translate }}</p>
            } @else {
            <p class="empty__headline">{{ 'LISTS.EMPTY_HEADLINE' | translate }}</p>
            <p class="empty__sub">{{ 'LISTS.EMPTY_SUB' | translate }}</p>
            }
        </div>
        }

        <ul class="card-list" role="list" [attr.aria-label]="'LISTS.MENU_IMPORT' | translate">
            @for (list of lists(); track list.id) {
            <app-list-card
                [list]="list"
                [unread]="unreadFor(list.id)"
                [isActive]="activeListId() === list.id"
                [members]="membersFor(list.id)"
                (open)="openList(list.id)" />
            }
        </ul>

    </main>

    <button class="fab" (click)="openCreateDialog()" [attr.aria-label]="'LISTS.CREATE_TITLE' | translate">
        <span aria-hidden="true">+</span>
    </button>

    <app-create-list-dialog
        [show]="showCreateDialog()"
        [creating]="creating()"
        [error]="createError()"
        (create)="createList($event)"
        (close)="showCreateDialog.set(false)" />

    <app-import-dialog
        [show]="showImportDialog()"
        (closed)="showImportDialog.set(false)" />

    <app-export-dialog
        [show]="showExportDialog()"
        [lists]="visibleLists()"
        [activeListId]="activeListId()"
        (closed)="showExportDialog.set(false)" />

    <app-list-filter-dialog
        [show]="showFilterDialog()"
        [query]="searchQuery()"
        [sortOrder]="prefs.listSortOrder()"
        (queryChange)="searchQuery.set($event)"
        (sortOrderChange)="prefs.setListSortOrder($event)"
        (closed)="showFilterDialog.set(false)" />

    <app-reveal-dialog
        [show]="showRevealDialog()"
        (closed)="showRevealDialog.set(false)" />

    <app-mark-all-read-dialog
        [show]="showMarkAllReadDialog()"
        [marking]="markingAllRead()"
        (confirm)="confirmMarkAllRead()"
        (cancel)="showMarkAllReadDialog.set(false)" />

</div>
