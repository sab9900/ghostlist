<div class="screen" role="main" appSwipeBack (swipeBack)="goBack()">

    <header class="header" role="banner">
        <button class="back" (click)="goBack()" [attr.aria-label]="'LIST_DETAIL.BACK_ARIA' | translate">
            <svg lucideChevronLeft [size]="20" aria-hidden="true"></svg>
        </button>
        <h1 class="title">{{ 'SETTINGS.TITLE' | translate }}</h1>
    </header>

    <main class="content">
        <div class="content-inner">

            <div class="settings-grid">

                <div class="settings-col">

                    <app-name-section
                        [currentName]="prefs.senderName()"
                        (save)="saveName($event)" />

                    <app-appearance-section
                        [theme]="themeService.theme()"
                        [accent]="themeService.accent()"
                        [themeOptions]="themeOptions"
                        [accentOptions]="accentOptions"
                        (themeChange)="setTheme($event)"
                        (accentChange)="setAccent($event)" />

                    <app-language-section
                        [currentLang]="langService.currentLang()"
                        [langs]="supportedLangs"
                        (change)="setLanguage($event)" />

                </div>

                <div class="settings-col">

                    <app-security-section
                        [isSupported]="webAuthn.isSupported()"
                        [isEnabled]="webAuthn.isEnabled()"
                        [working]="biometricWorking()"
                        [error]="biometricError()"
                        [autoLockTimeout]="webAuthn.autoLockTimeout()"
                        [autoLockOptions]="autoLockOptions"
                        (enable)="enableBiometricLock()"
                        (disable)="disableBiometricLock()"
                        (autoLockChange)="webAuthn.setAutoLockTimeout($event)" />

                    <app-master-password-section
                        [hasPassword]="masterPassword.hasPassword()"
                        [mode]="mpMode()"
                        [working]="mpWorking()"
                        [error]="mpError()"
                        [saved]="mpSaved()"
                        (startSet)="mpMode.set('set')"
                        (startChange)="mpMode.set('change')"
                        (startRemove)="mpMode.set('remove')"
                        (cancel)="cancelMasterPassword()"
                        (submitSet)="submitSetMasterPassword($event)"
                        (submitChange)="submitChangeMasterPassword($event)"
                        (submitRemove)="submitRemoveMasterPassword($event)" />

                    <app-sync-section
                        [webAuthnEnabled]="webAuthn.isEnabled()"
                        [syncStep]="syncStep()"
                        [syncImportedCount]="syncImportedCount()"
                        (startSync)="startSync()" />

                    <app-notifications-section
                        [permission]="webPushPermission()"
                        [enabled]="notificationsEnabled()"
                        [enabling]="notifEnabling()"
                        [pushActive]="pushActive()"
                        (toggle)="toggleNotifications($event)" />

                    @if (!layout.isDesktop()) {
                    <app-haptics-section
                        [enabled]="prefs.hapticsEnabled()"
                        (toggle)="setHapticsEnabled($event)" />
                    }

                </div>

            </div>

        </div>
    </main>

    <app-sync-dialog
        [show]="showSyncDialog()"
        (closed)="showSyncDialog.set(false)"
        (done)="onSyncDone($event)" />

</div>
