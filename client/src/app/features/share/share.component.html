<div class="screen" role="main">

    <header class="header" role="banner">
        <h1 class="title">Ghost List</h1>
        <button class="close" (click)="cancel()" [attr.aria-label]="'COMMON.CANCEL' | translate">
            <svg lucideX [size]="20" aria-hidden="true"></svg>
        </button>
    </header>

    <div class="content">

        @if (fileNames().length > 0) {
            <div class="files">
                @for (name of fileNames(); track name) {
                    <span class="file-chip">{{ name }}</span>
                }
            </div>
        }

        @if (shareText()) {
            <p class="share-text">{{ shareText() }}</p>
        }

        <section class="section" aria-labelledby="target-heading">
            <h2 class="section-title" id="target-heading">{{ 'SHARE.TARGET' | translate }}</h2>
            <div class="option-list" role="radiogroup" aria-labelledby="target-heading">
                <button
                    class="option"
                    [class.option--active]="selectedTarget() === 'charon'"
                    role="radio"
                    [attr.aria-checked]="selectedTarget() === 'charon'"
                    (click)="selectTarget('charon')">
                    <svg lucideSkull [size]="18" aria-hidden="true" class="option-icon"></svg>
                    <span class="option-label">Charon Drop</span>
                    @if (selectedTarget() === 'charon') {
                        <span class="option-check" aria-hidden="true">✓</span>
                    }
                </button>
                <button
                    class="option"
                    [class.option--active]="selectedTarget() === 'chat'"
                    role="radio"
                    [attr.aria-checked]="selectedTarget() === 'chat'"
                    (click)="selectTarget('chat')">
                    <svg lucideGhost [size]="18" aria-hidden="true" class="option-icon"></svg>
                    <span class="option-label">Ghost Chat</span>
                    @if (selectedTarget() === 'chat') {
                        <span class="option-check" aria-hidden="true">✓</span>
                    }
                </button>
                <button
                    class="option"
                    [class.option--active]="selectedTarget() === 'nemesis'"
                    role="radio"
                    [attr.aria-checked]="selectedTarget() === 'nemesis'"
                    (click)="selectTarget('nemesis')">
                    <svg lucideReceipt [size]="18" aria-hidden="true" class="option-icon"></svg>
                    <span class="option-label">Nemesis</span>
                    @if (selectedTarget() === 'nemesis') {
                        <span class="option-check" aria-hidden="true">✓</span>
                    }
                </button>
            </div>
        </section>

        <section class="section" aria-labelledby="list-heading">
            <h2 class="section-title" id="list-heading">{{ 'SHARE.LIST' | translate }}</h2>
            <div class="option-list" role="radiogroup" aria-labelledby="list-heading">
                @for (list of knownLists(); track list.id) {
                    <button
                        class="option"
                        [class.option--active]="selectedListId() === list.id"
                        role="radio"
                        [attr.aria-checked]="selectedListId() === list.id"
                        (click)="selectList(list)">
                        <span class="option-label">{{ list.name }}</span>
                        @if (selectedListId() === list.id) {
                            <span class="option-check" aria-hidden="true">✓</span>
                        }
                    </button>
                }
            </div>
        </section>

    </div>

    <div class="footer">
        <button
            class="btn btn--primary btn--block"
            [disabled]="!selectedListId()"
            (click)="confirm()">
            {{ 'SHARE.CONFIRM' | translate }}
        </button>
    </div>

</div>
